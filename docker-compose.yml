version: "3.9"

# ──────────────────────────────────────────────
#  Local development stack
#  Run:  docker-compose up --build
#  API:  http://localhost:8000
#  Docs: http://localhost:8000/docs
# ──────────────────────────────────────────────

services:

  # ── PostgreSQL (mirrors Neon's Postgres 16) ──────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       loan_tracker
      POSTGRES_USER:     loan_user
      POSTGRES_PASSWORD: loan_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan_user -d loan_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI application ───────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8002:7860"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://loan_user:loan_pass@db:5432/loan_tracker
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source so --reload picks up live changes without rebuild
      - ./app:/code/app

volumes:
  pgdata:
